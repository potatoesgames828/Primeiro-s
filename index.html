<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Primeiro Site</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, sans-serif;
    }
    body {
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      padding: 30px;
      border-radius: 16px;
      text-align: center;
      max-width: 420px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
    }
    h1 {
      color: #38bdf8;
      font-size: 1.6rem;
      margin-bottom: 12px;
    }
    p {
      color: #94a3b8;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .badge {
      display: inline-block;
      background: #0284c7;
      color: #fff;
      font-weight: 600;
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>🚀 Site publicado com sucesso!</h1>
    <p>A ligação entre o GitHub e a Vercel está configurada e a funcionar perfeitamente.</p>
    <div class="badge">Vercel + GitHub Online</div>
  </div>
</body>
</html>
